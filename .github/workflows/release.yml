name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025-vs2026
          - name: linux-x64
            os: ubuntu-latest
          - name: macos
            os: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned BtrieveFileSaver revision
        shell: bash
        run: |
          submodule_path="third_party/BtrieveFileSaver-Code"
          expected_revision="$(git rev-parse "HEAD:$submodule_path")"
          actual_revision="$(git -C "$submodule_path" rev-parse HEAD)"
          test -n "$expected_revision"
          test "$actual_revision" = "$expected_revision"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 file wget zip

      - name: Select macOS toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-version

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          -DQt6_DIR="$env:Qt6_DIR"
          -DCMAKE_BUILD_TYPE=Release
          -DCARDSTACK_DEPLOY_QT_AFTER_BUILD=ON
          -DCARDSTACK_WINDEPLOYQT_MODE=release
          -DCARDSTACK_DEPLOY_QT_TRANSLATIONS=OFF

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQt6_DIR="$Qt6_DIR"
          -DCARDSTACK_DEPLOY_QT_AFTER_BUILD=OFF
          -DCARDSTACK_DEPLOY_QT_TRANSLATIONS=OFF

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target CardStack CardStackTests

      - name: Build Unix
        if: runner.os != 'Windows'
        run: cmake --build build --target CardStack CardStackTests

      - name: Test
        run: ctest --test-dir build ${{ runner.os == 'Windows' && '-C Release' || '' }} --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Repeat Windows save and focus workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 3; ++$iteration) {
            Write-Host "Focused workflow repetition $iteration of 3"
            ctest --test-dir build -C Release --output-on-failure -R '^FocusedAuditRegressionTests$'
            $testExit = $LASTEXITCODE
            $log = "build/tests/FocusedAuditRegressionTests.txt"
            if (Test-Path -LiteralPath $log) {
              Copy-Item -LiteralPath $log -Destination "build/tests/FocusedAuditRegressionTests-repeat-$iteration.txt"
              Select-String -LiteralPath $log -Pattern '\[reused-store\]' | ForEach-Object { Write-Host $_.Line }
            }
            if ($testExit -ne 0) { exit $testExit }
          }
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $stage = "artifacts/CardStack-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "build/Release/CardStackDeploy/*" $stage
          Copy-Item -Force README.md,LICENSE,THIRD_PARTY_NOTICES.md $stage
          ./scripts/test-deployed-cardstack-windows.ps1 -DeployDir $stage
          Compress-Archive -Force -Path "$stage/*" -DestinationPath "artifacts/CardStack-windows-x64.zip"

      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p artifacts/package-root
          app="$(find build -name CardStack.app -type d | head -n 1)"
          test -n "$app"
          macdeployqt "$app" -verbose=1
          cp -R "$app" artifacts/package-root/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md artifacts/package-root/
          ditto -c -k --sequesterRsrc --keepParent artifacts/package-root/CardStack.app artifacts/CardStack-macos.zip
          zip -j artifacts/CardStack-macos.zip README.md LICENSE THIRD_PARTY_NOTICES.md

      - name: Package Linux AppImage zip
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p artifacts AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          # CMake's VERSION property makes this entry point a symlink on Unix.
          app="build/src/app/CardStack"
          test -x "$app"
          cp "$app" AppDir/usr/bin/CardStack
          cp docs/assets/cardstack-icon-source.png AppDir/usr/share/icons/hicolor/256x256/apps/cardstack.png
          cat > AppDir/usr/share/applications/cardstack.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=CardStack
          Comment=Modern card database
          Exec=CardStack
          Icon=cardstack
          Categories=Office;Database;
          Terminal=false
          DESKTOP
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          qt_plugin_dir="$("$QMAKE" -query QT_INSTALL_PLUGINS)"
          if [ -d "$qt_plugin_dir/sqldrivers" ]; then
            find "$qt_plugin_dir/sqldrivers" -type f ! -name 'libqsqlite.so' -delete
          fi
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv CardStack-*.AppImage artifacts/CardStack-linux-x64.AppImage
          cp README.md LICENSE THIRD_PARTY_NOTICES.md artifacts/
          zip -j artifacts/CardStack-linux-x64.zip artifacts/CardStack-linux-x64.AppImage README.md LICENSE THIRD_PARTY_NOTICES.md

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-logs-${{ matrix.name }}
          path: |
            build/tests/*.txt
            build/Testing/Temporary/LastTest.log
            build/deployment-smoke/*.txt
          if-no-files-found: ignore

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardStack-${{ matrix.name }}
          path: artifacts/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/CardStack-windows-x64.zip dist/CardStack-linux-x64.zip dist/CardStack-macos.zip)
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --generate-notes --draft
          fi
