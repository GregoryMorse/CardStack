name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC 2026
            os: windows-2025-vs2026
          - name: Ubuntu GCC
            os: ubuntu-latest
          - name: macOS Clang
            os: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned BtrieveFileSaver revision
        shell: bash
        run: |
          submodule_path="third_party/BtrieveFileSaver-Code"
          expected_revision="$(git rev-parse "HEAD:$submodule_path")"
          actual_revision="$(git -C "$submodule_path" rev-parse HEAD)"
          test -n "$expected_revision"
          test "$actual_revision" = "$expected_revision"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Select macOS toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-version

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          -DQt6_DIR="$env:Qt6_DIR"
          -DCARDSTACK_DEPLOY_QT_AFTER_BUILD=OFF

      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQt6_DIR="$Qt6_DIR"
          -DCARDSTACK_DEPLOY_QT_AFTER_BUILD=OFF

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target CardStack CardStackTests

      - name: Build Unix
        if: runner.os != 'Windows'
        run: cmake --build build --target CardStack CardStackTests

      - name: Check Linux packaging entry point
        if: runner.os == 'Linux'
        run: test -x build/src/app/CardStack

      - name: Test Windows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Test Unix
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Repeat Windows save and focus workflows
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure -R '^FocusedAuditRegressionTests$' --repeat until-fail:3
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Repeat macOS workspace lifetime regressions
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure -R '^DeckWorkspaceTests$' --repeat until-fail:10
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Capture macOS selection crash diagnostics
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          executable="$(find build -type f -name CardStackTests -perm -111 -print -quit)"
          if [ -n "$executable" ]; then
            mkdir -p build/tests
            lldb --batch -o run -o 'thread backtrace all' -- "$executable" --test DeckWorkspaceTests wholeFieldKeyboardSelection -o build/tests/macos-selection-replay.txt,txt > build/tests/macos-selection-lldb.txt 2>&1
          fi
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            build/tests/*.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    name: Ubuntu Clang ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Check native reader alignment and malformed input
        run: |
          mkdir -p native-safety
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            third_party/BtrieveFileSaver-Code/BtrieveFileSaverLib.c \
            third_party/BtrieveFileSaver-Code/tests/memory_input_test.c \
            -o native-safety/memory-input-test
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ./native-safety/memory-input-test native-safety/disposable.btr
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Configure instrumented build
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DQt6_DIR="$Qt6_DIR"
          -DCARDSTACK_ENABLE_SANITIZERS=ON
          -DCARDSTACK_DEPLOY_QT_AFTER_BUILD=OFF
      - name: Build instrumented tests
        run: cmake --build build-sanitized --target CardStackTests --parallel 2
      - name: Run full instrumented regression suite
        run: ctest --test-dir build-sanitized --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Upload sanitizer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: |
            build-sanitized/tests/*.txt
            build-sanitized/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
